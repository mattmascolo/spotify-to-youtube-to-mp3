[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotifytoyoutube"
version = "0.1.0"
description = "Fetch Spotify liked songs and find highest quality YouTube matches"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "spotipy>=2.23.0",
    "yt-dlp>=2024.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "responses>=0.25.0",
]

[project.scripts]
spotifytoyoutube = "spotifytoyoutube.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/spotifytoyoutube/cli.py" = ["E501"]  # CLI has ASCII art with long lines

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
